version: '3.8'

services:
  # 1. SERVICIO DE BASE DE DATOS
  db:
    image: postgres:15-alpine
    container_name: parcial_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: clave123
      POSTGRES_DB: parcial_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - parcial_network

  # 2. SERVICIO BACKEND (API)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: parcial_backend
    restart: always
    environment:
      PORT: 3000
      DB_USER: admin
      DB_PASSWORD: clave123
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: parcial_db
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - parcial_network

  # 3. SERVICIO FRONTEND (VISTA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parcial_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - parcial_network

# DEFINICIÓN DE REDES Y VOLÚMENES
networks:
  parcial_network:
    driver: bridge

volumes:
  pgdata: